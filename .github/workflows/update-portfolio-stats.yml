name: Update Portfolio Stats

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "18 5 * * *"

permissions:
  contents: write

concurrency:
  group: portfolio-publish
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Test publication automation
        run: npm test

      - name: Refresh Scholar cache
        id: scholar
        if: github.event_name != 'push'
        run: node scripts/update-scholar-cache.js
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Refresh public profile cache
        if: github.event_name != 'push'
        run: node scripts/update-profile-cache.js

      - name: Add new publication cards and images
        if: github.event_name != 'push'
        run: node scripts/update-publications.js
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PUBLICATIONS_INCREASED: ${{ steps.scholar.outputs.increased || 'false' }}

      - name: Commit publication and cache updates
        if: github.event_name != 'push'
        run: |
          git add index.html assets/scholar-stats.json assets/profile-stats.json assets/publications.json
          if [ -d assets/publications ]; then git add assets/publications; fi
          if git diff --cached --quiet; then
            echo "Portfolio unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update portfolio publications and stats"
          git push

      - name: Stage public website only
        run: |
          mkdir -p _site/scripts
          cp index.html styles.css script.js _site/
          cp -R assets _site/assets
          cp scripts/hero-orbit.mjs scripts/orbit-math.mjs scripts/ocr-field.js _site/scripts/

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
